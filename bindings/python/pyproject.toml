[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "engram"
version = "0.1.0"
description = "Python bindings for the engram arena-allocation library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.18"
